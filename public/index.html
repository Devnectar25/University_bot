<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AI Assistant – Ganpat University</title>
    <meta name="description"
        content="Ganpat University AI Chatbot — powered by RAG for instant answers on admissions, fees, and college life.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- App Styles -->
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <!-- React root mount point -->
    <div id="root"></div>

    <!-- React 18 & ReactDOM 18 -->
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone for in-browser JSX compilation -->
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <!-- Marked.js for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script>
        if (window.marked) {
            const renderer = new window.marked.Renderer();
            renderer.link = function(token) {
                let href = (typeof token === 'object' && token.href) ? token.href : arguments[0] || '';
                let title = (typeof token === 'object' && token.title) ? token.title : arguments[1] || '';
                let text = (typeof token === 'object' && token.text) ? token.text : arguments[2] || href;

                // Move accidental trailing punctuation outside the anchor
                let trailingPunct = '';
                const match = String(text).match(/([.,;:!?)]+)$/);
                if (match) {
                    trailingPunct = match[1];
                    text = String(text).slice(0, -trailingPunct.length);
                }
                href = String(href).replace(/[.,;:!?)]+$/, '');

                const titleAttr = title ? ' title="' + String(title).replace(/"/g, '&quot;') + '"' : '';
                return '<a href="' + href + '" target="_blank" rel="noopener noreferrer" class="chat-link"' + titleAttr + '>' +
                    text + ' <i class="bi bi-box-arrow-up-right chat-link-icon" aria-hidden="true"></i></a>' + trailingPunct;
            };
            window.marked.use({ renderer, gfm: true, breaks: true });
        }
    </script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

    <!-- App Constants & Translations -->
    <script src="/js/constants/i18n.js"></script>

    <!-- React Components (loaded in dependency order) -->
    <script type="text/babel" src="/js/components/BackgroundCanvas.js"></script>
    <script type="text/babel" src="/js/components/SidebarBrand.js"></script>
    <script type="text/babel" src="/js/components/ChatHistoryItem.js"></script>
    <script type="text/babel" src="/js/components/ChatHistoryList.js"></script>
    <script type="text/babel" src="/js/components/UserCard.js"></script>
    <script type="text/babel" src="/js/components/Sidebar.js"></script>
    <script type="text/babel" src="/js/components/LanguageToggle.js"></script>
    <script type="text/babel" src="/js/components/ChatHeader.js"></script>
    <script type="text/babel" src="/js/components/WelcomeCard.js"></script>
    <script type="text/babel" src="/js/components/MessageRow.js"></script>
    <script type="text/babel" src="/js/components/TypingIndicator.js"></script>
    <script type="text/babel" src="/js/components/ChatBody.js"></script>
    <script type="text/babel" src="/js/components/ChatFooter.js"></script>
    <script type="text/babel" src="/js/components/ChatPanel.js"></script>
    <script type="text/babel" src="/js/components/App.js"></script>

</body>

</html>
