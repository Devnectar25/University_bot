<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in – Ganpat University</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --bg:          #060912;
        --surface-2:   rgba(20, 28, 52, 0.85);
        --border:      rgba(255,255,255,0.07);
        --accent:      #6366f1;
        --accent2:     #8b5cf6;
        --text:        #f0f4ff;
        --muted:       #7c8db5;
        --danger:      #ef4444;
        --radius-lg:   16px;
        --radius-md:   12px;
        --transition:  0.25s cubic-bezier(.4,0,.2,1);
    }

    html, body {
        min-height: 100%;
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text);
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem 1rem;
        background:
            radial-gradient(600px circle at 15% 10%, rgba(99,102,241,0.18), transparent 60%),
            radial-gradient(500px circle at 85% 90%, rgba(139,92,246,0.16), transparent 60%),
            var(--bg);
    }

    .card {
        width: 100%;
        max-width: 380px;
        padding: 2rem 1.75rem;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 24px 60px rgba(0,0,0,0.5);
        backdrop-filter: blur(20px) saturate(180%);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.75rem;
    }
    .brand-icon {
        width: 40px; height: 40px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        border-radius: var(--radius-md);
        display: flex; align-items: center; justify-content: center;
        color: #fff;
        box-shadow: 0 4px 20px rgba(99,102,241,0.4);
    }
    .brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.05rem; }
    .brand-sub { font-size: 0.72rem; color: var(--muted); }

    h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.35rem; margin-bottom: 0.35rem; }
    .lead { font-size: 0.82rem; color: var(--muted); margin-bottom: 1.5rem; }

    label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 0.4rem; }
    input {
        width: 100%;
        padding: 0.7rem 0.9rem;
        margin-bottom: 1rem;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        color: var(--text);
        font-family: inherit;
        font-size: 0.9rem;
        outline: none;
        transition: all var(--transition);
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }

    .error {
        display: none;
        margin-bottom: 1rem;
        padding: 0.6rem 0.8rem;
        border-radius: 10px;
        background: rgba(239,68,68,0.08);
        border: 1px solid rgba(239,68,68,0.25);
        color: #fca5a5;
        font-size: 0.8rem;
    }
    .error.show { display: block; }

    button {
        width: 100%;
        padding: 0.75rem;
        border: none;
        border-radius: var(--radius-md);
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #fff;
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition);
    }
    button:hover { box-shadow: 0 6px 24px rgba(99,102,241,0.45); }
    button:disabled { opacity: 0.6; cursor: wait; }

    .back {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        margin-top: 1.25rem;
        font-size: 0.8rem;
        color: var(--muted);
        text-decoration: none;
    }
    .back:hover { color: var(--text); }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">
            <div class="brand-icon"><i class="bi bi-cpu-fill"></i></div>
            <div>
                <div class="brand-name">GUNi Assistant</div>
                <div class="brand-sub">Ganpat University, Mehsana</div>
            </div>
        </div>

        <h1>Sign in</h1>
        <p class="lead">Admin access for the Ganpat University assistant.</p>

        <form id="login-form" novalidate>
            <div class="error" id="login-error" role="alert"></div>

            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit" id="login-btn">Sign in</button>
        </form>

        <a href="/" class="back"><i class="bi bi-arrow-left"></i> Back to chat</a>
    </main>

<script>
const form = document.getElementById('login-form');
const errorBox = document.getElementById('login-error');
const loginBtn = document.getElementById('login-btn');

function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) return showError('Enter your username and password.');

    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in…';
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        if (res.ok) {
            window.location.href = '/';
            return;
        }
        const data = await res.json().catch(() => ({}));
        showError(data.error || 'Sign-in failed. Please try again.');
    } catch {
        showError('Could not reach the server. Check your connection and try again.');
    }
    loginBtn.disabled = false;
    loginBtn.textContent = 'Sign in';
});
</script>
</body>
</html>
