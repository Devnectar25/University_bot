<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign in – Ganpat University</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f8fafc;
            --surface-2: #ffffff;
            --border: #e2e8f0;
            --accent: #b31b25;
            --accent2: #8b141b;
            --text: #0f172a;
            --muted: #64748b;
            --danger: #ef4444;
            --radius-lg: 16px;
            --radius-md: 12px;
            --transition: 0.25s cubic-bezier(.4, 0, .2, 1);
        }

        html,
        body {
            min-height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem 1rem;
            background:
                radial-gradient(600px circle at 15% 10%, rgba(179, 27, 37, 0.08), transparent 60%),
                radial-gradient(500px circle at 85% 90%, rgba(217, 119, 6, 0.08), transparent 60%),
                var(--bg);
        }

        .card {
            width: 100%;
            max-width: 380px;
            padding: 2rem 1.75rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(20px) saturate(180%);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.75rem;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 4px 16px rgba(179, 27, 37, 0.3);
        }

        .brand-name {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            color: #0f172a;
        }

        .brand-sub {
            font-size: 0.72rem;
            color: var(--muted);
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.35rem;
            margin-bottom: 0.35rem;
            color: #0f172a;
        }

        .lead {
            font-size: 0.82rem;
            color: var(--muted);
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.4rem;
        }

        input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            margin-bottom: 1rem;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-md);
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: all var(--transition);
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(179, 27, 37, 0.15);
        }

        .error {
            display: none;
            margin-bottom: 1rem;
            padding: 0.6rem 0.8rem;
            border-radius: 10px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            font-size: 0.8rem;
        }

        .error.show {
            display: block;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 4px 14px rgba(179, 27, 37, 0.25);
        }

        button:hover {
            box-shadow: 0 6px 20px rgba(179, 27, 37, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            margin-top: 1.25rem;
            font-size: 0.8rem;
            color: var(--muted);
            text-decoration: none;
        }

        .back:hover {
            color: var(--accent);
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem 0.75rem;
            }

            .card {
                padding: 1.5rem 1.25rem;
                border-radius: 16px;
                max-width: 100%;
            }

            input {
                font-size: 16px;
                /* Prevents auto-zoom on iOS */
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="brand">
            <div class="brand-icon"><i class="bi bi-cpu-fill"></i></div>
            <div class="brand-icon"
                style="background: #ffffff; padding: 4px; border: 1px solid var(--border); overflow: hidden;">
                <img src="/images/guni-crest.png" alt="Ganpat University Logo"
                    style="width: 100%; height: 100%; object-fit: contain;">
            </div>
            <div>
                <div class="brand-name">GUNi Assistant</div>
                <div class="brand-sub">Ganpat University, Mehsana</div>
            </div>
        </div>

        <h1>Sign in</h1>
        <p class="lead">Admin access for the Ganpat University assistant.</p>

        <form id="login-form" novalidate>
            <div class="error" id="login-error" role="alert"></div>

            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit" id="login-btn">Sign in</button>
        </form>

        <a href="/" class="back"><i class="bi bi-arrow-left"></i> Back to chat</a>
    </main>

    <script>
        const form = document.getElementById('login-form');
        const errorBox = document.getElementById('login-error');
        const loginBtn = document.getElementById('login-btn');

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.classList.add('show');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.remove('show');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) return showError('Enter your username and password.');

            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in…';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (res.ok) {
                    window.location.href = '/';
                    return;
                }
                const data = await res.json().catch(() => ({}));
                showError(data.error || 'Sign-in failed. Please try again.');
            } catch {
                showError('Could not reach the server. Check your connection and try again.');
            }
            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign in';
        });
    </script>
</body>

</html>
